<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Arena – Scraper Launcher</title>
  <style>
    :root {
      --bg: #1a1b23;
      --surface: #25262e;
      --border: #3d3f4a;
      --text: #e8e9ed;
      --muted: #9a9ca8;
      --accent: #7c8cff;
      --accent-hover: #9aa8ff;
      --success: #5dd089;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--text);
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    section h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 14px;
    }
    .row {
      margin-bottom: 14px;
    }
    .row:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--text);
    }
    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .radio-group, .checkbox-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
    }
    .radio-wrap, .checkbox-wrap {
      align-items: center;
    }
    .radio-wrap label, .checkbox-wrap label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      cursor: pointer;
    }
    input[type="radio"], input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-start {
      background: var(--accent);
      color: #fff;
      width: 100%;
      margin-top: 8px;
    }
    .btn-start:hover {
      background: var(--accent-hover);
    }
    .btn-start:active {
      transform: scale(0.98);
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      display: none;
    }
    .message.show { display: block; }
    .message.success {
      background: rgba(93, 208, 137, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }
    .message strong { display: block; margin-bottom: 4px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Grand Arena – Scraper Launcher</h1>
    <p class="subtitle">Set options below, then click Start to download a launcher. Run the downloaded file from your project folder to start the script.</p>

    <form id="form">
      <section>
        <h2>What to run</h2>
        <div class="radio-group">
          <div class="radio-wrap">
            <input type="radio" name="mode" id="mode_both" value="both" checked>
            <label for="mode_both">Both (contests + mokis)</label>
          </div>
          <div class="radio-wrap">
            <input type="radio" name="mode" id="mode_contests" value="contests">
            <label for="mode_contests">Contests only</label>
          </div>
          <div class="radio-wrap">
            <input type="radio" name="mode" id="mode_mokis" value="mokis">
            <label for="mode_mokis">Mokis only</label>
          </div>
        </div>
      </section>

      <section>
        <h2>Browser &amp; schedule</h2>
        <div class="row checkbox-wrap">
          <label>
            <input type="checkbox" id="show_browser" name="show">
            Show browser windows
          </label>
        </div>
        <div class="row">
          <label for="every">Run</label>
          <div class="radio-group">
            <div class="radio-wrap">
              <input type="radio" name="schedule" id="schedule_once" value="once" checked>
              <label for="schedule_once">Once</label>
            </div>
            <div class="radio-wrap">
              <input type="radio" name="schedule" id="schedule_every" value="every">
              <label for="schedule_every">Every</label>
            </div>
          </div>
          <input type="number" id="every" name="every" value="30" min="1" max="1440" style="width:80px; margin-top:8px; display:inline-block;" placeholder="30">
          <span class="hint" style="display:inline;"> minutes</span>
        </div>
      </section>

      <section>
        <button type="submit" class="btn btn-start" id="btn_start">Start – download launcher</button>
        <div id="message" class="message"></div>
      </section>
    </form>
  </div>

  <script>
    (function () {
      var form = document.getElementById('form');
      var scheduleOnce = document.getElementById('schedule_once');
      var scheduleEvery = document.getElementById('schedule_every');
      var everyInput = document.getElementById('every');
      var messageEl = document.getElementById('message');

      function showMessage(text, isSuccess) {
        messageEl.textContent = '';
        messageEl.innerHTML = text;
        messageEl.className = 'message show ' + (isSuccess ? 'success' : '');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var mode = document.querySelector('input[name="mode"]:checked').value;
        var show = document.getElementById('show_browser').checked;
        var schedule = document.querySelector('input[name="schedule"]:checked').value;
        var every = parseInt(document.getElementById('every').value, 10) || 30;

        var args = [];
        if (mode === 'contests') args.push('--contests');
        if (mode === 'mokis') args.push('--mokis');
        if (show) args.push('--show');
        if (schedule === 'every' && every > 0) args.push('--every', String(every));

        var cmd = 'python run_scraping.py ' + args.join(' ');
        var bat = '@echo off\nsetlocal\ncd /d "%~dp0"\n\n';
        if (every > 0 && schedule === 'every') {
          bat += 'echo Grand Arena – running every ' + every + ' minutes. Press Ctrl+C to stop.\n';
        }
        bat += 'if exist ".venv\\Scripts\\activate.bat" call .venv\\Scripts\\activate.bat\n';
        bat += cmd + '\n\necho.\npause\n';

        var blob = new Blob([bat], { type: 'text/plain' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'run_grandarena.bat';
        a.click();
        URL.revokeObjectURL(url);

        showMessage(
          '<strong>Launcher downloaded</strong> Save <code>run_grandarena.bat</code> in your project folder (e.g. C:\\git\\grandarena), then double-click it to run.',
          true
        );
      });
    })();
  </script>
</body>
</html>
